version: '3.8'
services:
  api:
    build: ./api
    ports: 
       - "8000:8000"
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
    depends_on:
      redis:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
    depends_on:
      api:
        condition: service_healthy

  redis:
    image: redis:alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M


  worker:
    build: ./worker
    environment:
      - REDIS_HOST=redis
    depends_on:
      redis:
        condition: service_healthy

networks:
  default:
    name: hng_network