name: DevOps CI Pipeline
on: [push]
jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - name: Install Tools
        run: pip install flake8 pytest pytest-cov pytest-mock
      - name: Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: api/Dockerfile
      - name: Pytest
        run: pytest --cov=api tests/ --cov-report=xml
      - name: Upload Coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  security:
    runs-on: ubuntu-latest
    needs: test-and-lint
    steps:
      - uses: actions/checkout@v3
      - name: Build
        run: docker build -t hng-api:latest ./api
      - name: Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'hng-api:latest'
          format: 'sarif'
          output: 'trivy-results.sarif'
      - name: Upload SARIF
        uses: actions/upload-artifact@v4
        with:
          name: security-report
integration-test:
    runs-on: ubuntu-latest
    needs: security
    steps:
      - uses: actions/checkout@v3

      - name: Build and Start Infrastructure
        run: docker compose up -d --build

      - name: Wait for services
        run: sleep 10

      - name: Verify API Health (Internal Network)
        run: |
          docker compose exec -T api python -c \
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"

      - name: Stop Services
        if: always()
        run: docker compose down
    