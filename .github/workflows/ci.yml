name: DevOps CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Python linter
        run: pip install flake8

      - name: Lint Python (flake8)
        run: flake8 api/ worker/ --max-line-length=120

      - name: Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install ESLint
        run: npm install -g eslint@8

      - name: Lint JavaScript (eslint)
        run: eslint frontend/app.js --env node --parser-options=ecmaVersion:2020

      - name: Install Hadolint
        run: |
          wget -qO /usr/local/bin/hadolint \
            https://github.com/hadolint/hadolint/releases/latest/download/hadolint-Linux-x86_64
          chmod +x /usr/local/bin/hadolint

      - name: Lint Dockerfiles (hadolint)
        run: |
          hadolint --ignore DL3008 --ignore DL3009 api/Dockerfile
          hadolint --ignore DL3008 --ignore DL3009 worker/Dockerfile
          hadolint --ignore DL3008 --ignore DL3009 frontend/Dockerfile

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r api/requirements.txt
          pip install pytest pytest-cov

      - name: Run tests with coverage
        run: |
          pytest tests/ \
            --cov=api \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  build:
    runs-on: ubuntu-latest
    needs: test
    services:
      registry:
        image: registry:2
        ports:
          - 5000:5000

    steps:
      - uses: actions/checkout@v3

      - name: Set short SHA
        run: echo "SHA=$(echo $GITHUB_SHA | cut -c1-7)" >> $GITHUB_ENV

      - name: Build API image
        run: |
          docker build -t localhost:5000/hng-api:${{ env.SHA }} \
                       -t localhost:5000/hng-api:latest ./api
          docker push localhost:5000/hng-api:${{ env.SHA }}
          docker push localhost:5000/hng-api:latest

      - name: Build Worker image
        run: |
          docker build -t localhost:5000/hng-worker:${{ env.SHA }} \
                       -t localhost:5000/hng-worker:latest ./worker
          docker push localhost:5000/hng-worker:${{ env.SHA }}
          docker push localhost:5000/hng-worker:latest

      - name: Build Frontend image
        run: |
          docker build -t localhost:5000/hng-frontend:${{ env.SHA }} \
                       -t localhost:5000/hng-frontend:latest ./frontend
          docker push localhost:5000/hng-frontend:${{ env.SHA }}
          docker push localhost:5000/hng-frontend:latest

      - name: Save images as artifacts
        run: |
          docker save localhost:5000/hng-api:latest \
                      localhost:5000/hng-worker:latest \
                      localhost:5000/hng-frontend:latest \
            | gzip > images.tar.gz

      - name: Upload images artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-images
          path: images.tar.gz

  security:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v3

      - name: Build images for scanning
        run: |
          docker build -t hng-api:latest ./api
          docker build -t hng-worker:latest ./worker
          docker build -t hng-frontend:latest ./frontend

      - name: Scan API image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'hng-api:latest'
          format: 'sarif'
          output: 'trivy-api.sarif'
          severity: 'CRITICAL'
          exit-code: '0'

      - name: Scan Worker image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'hng-worker:latest'
          format: 'sarif'